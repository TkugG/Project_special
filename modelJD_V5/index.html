<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>SkillMatch IT - ระบบค้นหาและแนะนำตำแหน่งงานไอทีตามทักษะ</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Google Fonts: Sarabun & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Sarabun:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <!-- Application Styles: Modern White Theme & Accent Pink -->
    <link rel="stylesheet" href="css/style.css?v=4.2.0">
</head>

<body
    class="min-h-screen text-slate-800 selection:bg-rose-200 selection:text-rose-900 font-normal flex flex-col justify-between">

    <!-- Top Navigation Bar (Modern White Glass) -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="h-16 flex items-center justify-between gap-4">

                <!-- Logo & Brand Title with Accent Pink Gradient -->
                <a href="#/matcher" class="flex items-center gap-2.5 group">
                    <div
                        class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 via-pink-500 to-rose-600 flex items-center justify-center text-white text-base shadow-md shadow-rose-500/25 group-hover:scale-105 transition-transform duration-200">
                        <i class="fa-solid fa-crosshairs"></i>
                    </div>
                    <h1 class="text-lg md:text-xl font-black text-slate-900 font-english tracking-tight">
                        SkillMatch <span class="text-rose-600">IT</span>
                    </h1>
                </a>

                <!-- Desktop SPA Navigation Tabs (Clean White & Pink Active) -->
                <nav
                    class="hidden lg:flex items-center gap-2 bg-slate-100/90 p-1.5 rounded-2xl border border-slate-200/80 text-sm font-bold text-slate-600 shadow-inner">
                    <a href="#/matcher" data-route="#/matcher"
                        class="nav-link px-4 py-2 rounded-xl flex items-center gap-2">
                        <i class="fa-solid fa-bullseye text-rose-500"></i>
                        <span>ค้นหางานที่ใช่</span>
                    </a>
                    <a href="#/skills" data-route="#/skills"
                        class="nav-link px-4 py-2 rounded-xl flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-slate-500"></i>
                        <span>คลังทักษะ</span>
                    </a>
                </nav>

                <!-- Right Live Status & Skill Basket Pill & Inspector Link -->
                <div class="flex items-center gap-2">
                    <a href="/inspect.html" target="_blank"
                        class="text-xs font-bold text-slate-700 hover:text-rose-600 px-3 py-1.5 rounded-xl border border-slate-200 hover:border-rose-300 bg-white hover:bg-rose-50 flex items-center gap-1.5 shadow-2xs transition-all"
                        title="เปิดหน้าจอแกะรอยข้อมูลจริงสำหรับเล่มวิทยานิพนธ์บทที่ 3-4">
                        <i class="fa-solid fa-microscope text-rose-600"></i>
                        <span class="hidden sm:inline">แกะรอยข้อมูล</span>
                    </a>
                    <a href="#/matcher" id="headerSkillBadge"
                        class="hidden text-xs font-black bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-3.5 py-1.5 rounded-xl shadow-2xs transition-all items-center gap-1.5 animate__animated animate__fadeIn">
                        <i class="fa-solid fa-check-double text-rose-600"></i> 0 ทักษะ
                    </a>
                </div>

            </div>

            <!-- Mobile Sub-Navigation Bar -->
            <nav
                class="lg:hidden flex items-center justify-around gap-2 py-3 border-t border-slate-100 text-xs font-bold text-slate-600 px-4">
                <a href="#/matcher" data-route="#/matcher"
                    class="nav-link px-3 py-2 rounded-xl whitespace-nowrap flex items-center gap-1.5 flex-1 justify-center">
                    <i class="fa-solid fa-bullseye"></i>
                    <span>ค้นหางาน</span>
                </a>
                <a href="#/skills" data-route="#/skills"
                    class="nav-link px-3 py-2 rounded-xl whitespace-nowrap flex items-center gap-1.5 flex-1 justify-center">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>คลังทักษะ</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content Viewport (Router Target) -->
    <main class="max-w-4xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 w-full flex-1">
        <div id="router-view" class="w-full">
            <!-- Dynamic SPA Views loaded here -->
        </div>
    </main>

    <!-- Compact Footer -->
    <footer class="mt-auto py-4 border-t border-slate-200/80 bg-white text-xs text-slate-400">
        <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-1 text-center sm:text-left">
            <span class="font-bold text-slate-700">SkillMatch IT</span>
            <span>ระบบค้นหาและแนะนำตำแหน่งงานตามทักษะ</span>
        </div>
    </footer>

    <!-- JAVASCRIPT MODULES & ROUTER SCRIPTS -->
    <script src="js/state.js?v=5.0.0"></script>
    <script src="js/api.js?v=5.0.0"></script>
    <script src="js/components/jobCard.js?v=5.0.0"></script>
    <script src="js/views/matcherView.js?v=5.0.0"></script>
    <script src="js/views/skillsView.js?v=5.0.0"></script>
    <script src="js/router.js?v=5.0.0"></script>
    <script src="js/app.js?v=5.0.0"></script>
</body>

</html>
